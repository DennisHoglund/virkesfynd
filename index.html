<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Virkesfynd</title>
  <meta name="theme-color" content="#14231a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Virkesfynd">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Inloggning -->
  <section id="login" class="screen" hidden>
    <div class="login-card">
      <div class="logo">🪵</div>
      <h1>Virkesfynd</h1>
      <p class="muted">Sundsta grönområden</p>
      <form id="login-email">
        <label>E-post<input type="email" id="email" autocomplete="email" required></label>
        <button class="btn primary" type="submit">Skicka kod</button>
      </form>
      <form id="login-code" hidden>
        <p class="muted" id="code-info"></p>
        <label>Kod från mejlet<input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required></label>
        <button class="btn primary" type="submit">Logga in</button>
        <button class="btn ghost" type="button" id="login-back">Byt e-post</button>
      </form>
      <p class="error" id="login-error"></p>
    </div>
  </section>

  <!-- Konfiguration saknas -->
  <section id="noconfig" class="screen" hidden>
    <div class="login-card">
      <div class="logo">⚙️</div>
      <h1>Nästan klart</h1>
      <p class="muted">Fyll i <code>supabaseUrl</code> och <code>supabaseAnonKey</code> i <code>config.js</code>.</p>
    </div>
  </section>

  <!-- Karta -->
  <main id="app" hidden>
    <div id="map"></div>

    <div id="crosshair" hidden><span></span></div>

    <header class="topbar">
      <button class="chip" id="btn-list" aria-label="Lista">☰ <span id="count">0</span> kvar</button>
      <div class="topbar-right">
        <button class="round" id="btn-layers" aria-label="Kartlager">◫</button>
        <button class="round" id="btn-menu" aria-label="Meny">⋯</button>
      </div>
    </header>

    <div class="fabs">
      <button class="round big" id="btn-locate" aria-label="Min position">◎</button>
    </div>
    <button class="fab" id="btn-new">＋ Nytt fynd</button>

    <!-- Placeringsläge -->
    <div class="place-bar" id="place-bar" hidden>
      <p>Flytta kartan så krysset hamnar på fyndet</p>
      <div class="row">
        <button class="btn ghost" id="place-cancel">Avbryt</button>
        <button class="btn" id="place-gps">Min position</button>
        <button class="btn primary" id="place-ok">Här</button>
      </div>
    </div>
  </main>

  <!-- Ark (bottom sheets) -->
  <div class="backdrop" id="backdrop" hidden></div>

  <section class="sheet" id="sheet-new" hidden>
    <div class="grip"></div>
    <h2>Nytt fynd</h2>
    <form id="form-new">
      <div class="photos" id="new-photos">
        <label class="photo-add">
          <input type="file" id="new-photo-input" accept="image/*" capture="environment" multiple hidden>
          <span>📷<br>Ta foto</span>
        </label>
      </div>
      <div class="seg" id="new-typ">
        <button type="button" data-v="vindfalle" class="on">Vindfälle</button>
        <button type="button" data-v="timmer">Timmer</button>
        <button type="button" data-v="ris">Ris</button>
        <button type="button" data-v="annat">Annat</button>
      </div>
      <label>Kommentar
        <textarea id="new-kommentar" rows="3" placeholder="T.ex. gran ca 6 m över stigen, behöver sågas i 3 bitar"></textarea>
      </label>
      <p class="muted small" id="new-pos"></p>
      <div class="row">
        <button type="button" class="btn ghost" id="new-cancel">Avbryt</button>
        <button type="submit" class="btn primary" id="new-save">Spara</button>
      </div>
    </form>
  </section>

  <section class="sheet" id="sheet-detail" hidden>
    <div class="grip"></div>
    <div id="detail"></div>
  </section>

  <section class="sheet" id="sheet-list" hidden>
    <div class="grip"></div>
    <div class="list-head">
      <h2>Fynd</h2>
      <div class="seg small" id="list-filter">
        <button type="button" data-v="kvar" class="on">Kvar</button>
        <button type="button" data-v="alla">Alla</button>
      </div>
    </div>
    <ul id="list"></ul>
  </section>

  <section class="sheet" id="sheet-layers" hidden>
    <div class="grip"></div>
    <h2>Kartlager</h2>
    <div class="layers" id="layers"></div>
  </section>

  <section class="sheet" id="sheet-menu" hidden>
    <div class="grip"></div>
    <h2>Inställningar</h2>
    <label>Ditt namn (syns på fynd du skapar)
      <input type="text" id="my-name" maxlength="40">
    </label>
    <p class="muted small" id="me-email"></p>
    <div class="row">
      <button class="btn ghost" id="btn-logout">Logga ut</button>
      <button class="btn primary" id="btn-save-name">Spara</button>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
