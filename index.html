<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Virkesfynd</title>
  <meta name="theme-color" content="#14231a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Virkesfynd">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Inloggning -->
  <section id="login" class="screen" hidden>
    <div class="login-card">
      <div class="logo">🪵</div>
      <h1>Virkesfynd</h1>
      <p class="muted">Logga in för att se dina fynd</p>
      <form id="login-form" method="post" action="#">
        <label>E-post<input type="email" id="email" name="email" autocomplete="username" autocapitalize="off" required></label>
        <label>Lösenord<input type="password" id="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit" id="login-btn">Logga in</button>
      </form>
      <p class="error" id="login-error"></p>
      <button class="btn ghost" type="button" id="login-cancel" hidden style="width:100%">Avbryt</button>
    </div>
  </section>

  <!-- Karta -->
  <main id="app" hidden>
    <div id="map"></div>

    <div id="crosshair" hidden><span></span></div>

    <header class="topbar">
      <button class="chip" id="btn-list" aria-label="Lista">☰ <span id="count">0</span> kvar</button>
      <div class="topbar-right">
        <button class="chip sync" id="btn-sync" hidden>Offline</button>
        <button class="round" id="btn-log" aria-label="Logg">📒</button>
        <button class="round" id="btn-layers" aria-label="Kartlager">◫</button>
        <button class="round" id="btn-menu" aria-label="Meny">⋯</button>
      </div>
    </header>

    <button class="banner" id="relogin" hidden>🔒 Inloggningen har gått ut – tryck för att logga in</button>

    <div class="fabs">
      <button class="round big" id="btn-locate" aria-label="Min position">◎</button>
    </div>
    <button class="fab" id="btn-new">＋ Nytt fynd</button>

    <!-- Placeringsläge -->
    <div class="place-bar" id="place-bar" hidden>
      <p id="place-text">Flytta kartan så krysset hamnar på fyndet</p>
      <div class="row">
        <button class="btn ghost" id="place-cancel">Avbryt</button>
        <button class="btn" id="place-gps">Min position</button>
        <button class="btn primary" id="place-ok">Här</button>
      </div>
    </div>
  </main>

  <!-- Ark (bottom sheets) -->
  <div class="backdrop" id="backdrop" hidden></div>

  <section class="sheet" id="sheet-new" hidden>
    <div class="grip"></div>
    <h2 id="form-title">Nytt fynd</h2>
    <form id="form-new">
      <div class="photos" id="new-photos">
        <label class="photo-add">
          <input type="file" id="new-photo-input" accept="image/*" capture="environment" hidden>
          <span>📷<br>Ta foto</span>
        </label>
        <label class="photo-add">
          <input type="file" id="new-photo-pick" accept="image/*" multiple hidden>
          <span>🖼️<br>Välj bilder</span>
        </label>
      </div>
      <div class="seg" id="new-typ">
        <button type="button" data-v="vindfalle" class="on">Vindfälle</button>
        <button type="button" data-v="timmer">Timmer</button>
        <button type="button" data-v="ris">Ris</button>
        <button type="button" data-v="annat">Annat</button>
      </div>
      <div id="ext-fields" class="ext">
        <div class="field-label">Prioritet</div>
        <div class="seg" id="f-prio">
          <button type="button" data-v="normal" class="on">Normal</button>
          <button type="button" data-v="brattom">⚠️ Bråttom</button>
          <button type="button" data-v="stig">🚧 Över stig</button>
        </div>
        <div class="field-label">Trädslag</div>
        <div class="chips" id="f-tradslag">
          <button type="button" data-v="Gran">Gran</button>
          <button type="button" data-v="Tall">Tall</button>
          <button type="button" data-v="Björk">Björk</button>
          <button type="button" data-v="Ek">Ek</button>
          <button type="button" data-v="Asp">Asp</button>
          <button type="button" data-v="Al">Al</button>
          <button type="button" data-v="Blandat">Blandat</button>
        </div>
        <div class="row" id="old-size">
          <label>Antal stammar<input type="number" id="f-antal" inputmode="numeric" min="1" max="999" placeholder="t.ex. 2"></label>
          <label>Grövsta Ø (cm)<input type="number" id="f-diam" inputmode="numeric" min="1" max="300" placeholder="t.ex. 35"></label>
        </div>
        <div id="stam-box" hidden>
          <div class="field-label">Stammar <span class="muted small">– längd i meter, diameter på mitten i cm</span></div>
          <div id="stam-list"></div>
          <button type="button" class="btn ghost" id="stam-add">＋ Lägg till stam</button>
          <p class="stam-sum" id="stam-sum"></p>
        </div>
      </div>
      <label>Kommentar
        <textarea id="new-kommentar" rows="3" placeholder="T.ex. gran ca 6 m över stigen, behöver sågas i 3 bitar"></textarea>
      </label>
      <p class="muted small" id="new-pos"></p>
      <div class="row">
        <button type="button" class="btn ghost" id="new-cancel">Avbryt</button>
        <button type="submit" class="btn primary" id="new-save">Spara</button>
      </div>
    </form>
  </section>

  <section class="sheet" id="sheet-detail" hidden>
    <div class="grip"></div>
    <div id="detail"></div>
  </section>

  <section class="sheet" id="sheet-list" hidden>
    <div class="grip"></div>
    <div class="list-head">
      <h2>Fynd</h2>
      <div class="seg small" id="list-filter">
        <button type="button" data-v="kvar" class="on">Kvar</button>
        <button type="button" data-v="alla">Alla</button>
      </div>
    </div>
    <ul id="list"></ul>
  </section>

  <section class="sheet" id="sheet-log" hidden>
    <div class="grip"></div>
    <div class="log-head">
      <h2>Logg</h2>
      <div class="year-nav">
        <button type="button" id="log-prev" aria-label="Föregående år">‹</button>
        <span id="log-year"></span>
        <button type="button" id="log-next" aria-label="Nästa år">›</button>
      </div>
    </div>
    <div class="log-cards" id="log-cards"></div>
    <ul id="log-list"></ul>
  </section>

  <section class="sheet" id="sheet-layers" hidden>
    <div class="grip"></div>
    <h2>Kartlager</h2>
    <div class="layers" id="layers"></div>
  </section>

  <section class="sheet" id="sheet-menu" hidden>
    <div class="grip"></div>
    <h2>Konto</h2>
    <p class="muted small" id="me-email"></p>
    <h2>Uppladdning</h2>
    <p class="small" id="sync-info"></p>
    <p class="small error" id="sync-error" hidden></p>
    <div class="row">
      <button class="btn" id="btn-sync-now">Synka nu</button>
      <button class="btn danger" id="btn-discard" hidden>Släng väntande</button>
    </div>
    <div id="migrate-box" hidden>
      <h2>Fynd i telefonen</h2>
      <p class="small" id="migrate-info"></p>
      <button class="btn primary" id="btn-migrate" style="width:100%">Ladda upp till databasen</button>
    </div>
    <details class="pw-box" id="pw-box">
      <summary>🔑 Byt lösenord</summary>
      <form id="pw-form" autocomplete="on">
        <input type="email" name="email" id="pw-email" autocomplete="username" hidden>
        <label>Nuvarande lösenord<input type="password" id="pw-old" autocomplete="current-password" required></label>
        <label>Nytt lösenord<input type="password" id="pw-new" autocomplete="new-password" minlength="8" required></label>
        <label>Upprepa nytt lösenord<input type="password" id="pw-new2" autocomplete="new-password" minlength="8" required></label>
        <p class="small error" id="pw-error"></p>
        <button class="btn primary" type="submit" id="pw-save">Spara nytt lösenord</button>
      </form>
    </details>
    <div class="d-actions" style="margin-top:16px">
      <button class="btn ghost" id="btn-logout">Logga ut</button>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
