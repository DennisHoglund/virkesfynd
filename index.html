<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Virkesfynd</title>
  <meta name="theme-color" content="#14231a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Virkesfynd">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Karta -->
  <main id="app">
    <div id="map"></div>

    <div id="crosshair" hidden><span></span></div>

    <header class="topbar">
      <button class="chip" id="btn-list" aria-label="Lista">☰ <span id="count">0</span> kvar</button>
      <div class="topbar-right">
        <button class="round" id="btn-layers" aria-label="Kartlager">◫</button>
        <button class="round" id="btn-menu" aria-label="Säkerhetskopia">⋯</button>
      </div>
    </header>

    <div class="fabs">
      <button class="round big" id="btn-locate" aria-label="Min position">◎</button>
    </div>
    <button class="fab" id="btn-new">＋ Nytt fynd</button>

    <!-- Placeringsläge -->
    <div class="place-bar" id="place-bar" hidden>
      <p>Flytta kartan så krysset hamnar på fyndet</p>
      <div class="row">
        <button class="btn ghost" id="place-cancel">Avbryt</button>
        <button class="btn" id="place-gps">Min position</button>
        <button class="btn primary" id="place-ok">Här</button>
      </div>
    </div>
  </main>

  <!-- Ark (bottom sheets) -->
  <div class="backdrop" id="backdrop" hidden></div>

  <section class="sheet" id="sheet-new" hidden>
    <div class="grip"></div>
    <h2>Nytt fynd</h2>
    <form id="form-new">
      <div class="photos" id="new-photos">
        <label class="photo-add">
          <input type="file" id="new-photo-input" accept="image/*" capture="environment" multiple hidden>
          <span>📷<br>Ta foto</span>
        </label>
      </div>
      <div class="seg" id="new-typ">
        <button type="button" data-v="vindfalle" class="on">Vindfälle</button>
        <button type="button" data-v="timmer">Timmer</button>
        <button type="button" data-v="ris">Ris</button>
        <button type="button" data-v="annat">Annat</button>
      </div>
      <label>Kommentar
        <textarea id="new-kommentar" rows="3" placeholder="T.ex. gran ca 6 m över stigen, behöver sågas i 3 bitar"></textarea>
      </label>
      <p class="muted small" id="new-pos"></p>
      <div class="row">
        <button type="button" class="btn ghost" id="new-cancel">Avbryt</button>
        <button type="submit" class="btn primary" id="new-save">Spara</button>
      </div>
    </form>
  </section>

  <section class="sheet" id="sheet-detail" hidden>
    <div class="grip"></div>
    <div id="detail"></div>
  </section>

  <section class="sheet" id="sheet-list" hidden>
    <div class="grip"></div>
    <div class="list-head">
      <h2>Fynd</h2>
      <div class="seg small" id="list-filter">
        <button type="button" data-v="kvar" class="on">Kvar</button>
        <button type="button" data-v="alla">Alla</button>
      </div>
    </div>
    <ul id="list"></ul>
  </section>

  <section class="sheet" id="sheet-layers" hidden>
    <div class="grip"></div>
    <h2>Kartlager</h2>
    <div class="layers" id="layers"></div>
  </section>

  <section class="sheet" id="sheet-menu" hidden>
    <div class="grip"></div>
    <h2>Säkerhetskopia</h2>
    <p class="muted small">Fynden och fotona sparas bara i den här telefonen. Spara en kopia ibland, t.ex. till Filer eller iCloud Drive.</p>
    <p class="small" id="backup-info"></p>
    <div class="d-actions">
      <button class="btn primary" id="btn-export">Spara säkerhetskopia</button>
      <label class="btn" style="text-align:center;color:var(--text)">Återställ från kopia
        <input type="file" id="import-input" accept=".json,application/json" hidden></label>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
