# Håller Supabase-projektet vaket.
# Gratisprojekt pausas efter 7 dagar utan aktivitet – det här jobbet anropar
# databasen varannan dag så det aldrig blir så.
name: Håll Supabase vaket

on:
  schedule:
    - cron: "17 5 */2 * *"   # varannan dag 05:17 UTC
  workflow_dispatch:         # kan även köras för hand under Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anropa databasen
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'supabaseKey:\s*"\K[^"]+' config.js)
          echo "Pingar $URL"
          curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
          echo
